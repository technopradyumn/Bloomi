name: bloomi
description: "Bloomi - A friendly, offline-first health and nutrition tracking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^17.5.0
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.6.0+eol
  fl_chart: ^1.3.0
  health: ^13.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  geolocator: ^14.0.1
  http: ^1.6.0
  uuid: ^4.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: 11.3.1
  camera: ^0.12.0+2
  mobile_scanner: ^7.5.0
  geocoding: ^5.0.1
  package_info_plus: ^10.2.2
  upgrader: ^13.7.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/animations/
    - assets/images/
    - assets/data/
    - assets/l10n/

  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 600
